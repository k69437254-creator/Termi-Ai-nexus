name: Build TermiAI-Nexus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android local properties
        shell: bash
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          test -n "$FLUTTER_BIN"
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$FLUTTER_BIN")")")"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$FLUTTER_ROOT/packages/flutter_tools/gradle"
          test -d "$SDK_ROOT"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$SDK_ROOT" > android/local.properties

      - name: Set Android application label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          if not path.exists():
              raise SystemExit('AndroidManifest.xml was not generated.')
          data = path.read_text(encoding='utf-8')
          data = data.replace('android:label="termiai_nexus"', 'android:label="TermiAI-Nexus"')
          path.write_text(data, encoding='utf-8')
          PY

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Diagnose APK output
        if: always()
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find build android/app/build -type f -name '*.apk' -print 2>/dev/null || true
          echo "===== ANDROID OUTPUTS ====="
          find android/app/build/outputs build/app/outputs -maxdepth 6 -type f -print 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermiAI-Nexus-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
